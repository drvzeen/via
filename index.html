<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>VIA Bounce — Настройки</title>
<style>
  :root {
    --ink: #0a0a0a;
    --paper: #f5f5f2;
    --accent: #ff2b1f;
    --line: rgba(245,245,242,0.16);
    --line-strong: rgba(245,245,242,0.32);
    --text-dim: rgba(245,245,242,0.5);
  }
  * { box-sizing: border-box; }
  html, body {
    margin:0; padding:0; overflow:hidden; background:#000; height:100%;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    display:flex; align-items:center; justify-content:center;
  }
  canvas { display:block; touch-action: none; }

  /* ===== Apple-style стеклянная панель ===== */
  #panel {
    position: fixed; top: 12px; right: 12px; bottom: 12px;
    width: 340px; max-width: calc(100vw - 24px);
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    color: #f5f5f7;
    background: rgba(28,28,30,0.55);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    backdrop-filter: blur(30px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 26px;
    box-shadow: 0 24px 70px rgba(0,0,0,0.55);
    transform: translateX(calc(100% + 24px));
    transition: transform 0.5s cubic-bezier(.32,.72,0,1);
    z-index: 10;
    padding: 20px 16px 24px;
    font-family: -apple-system, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #panel.open { transform: translateX(0); }
  #panel::-webkit-scrollbar { width: 0; background: transparent; }

  .head { padding: 4px 8px 16px; }
  .head .mark { font-weight: 700; font-size: 26px; letter-spacing: -0.02em; }
  .head .sub {
    display:block; margin-top: 2px; font-size: 13px;
    letter-spacing: -0.01em; color: rgba(235,235,245,0.6);
  }
  .head-line { display: none; }

  /* Заголовок группы — как секция в настройках iOS */
  .sec { margin: 22px 8px 7px; }
  .sec .num, .sec-line { display: none; }
  .sec .title {
    font-size: 12px; font-weight: 400; text-transform: uppercase;
    letter-spacing: 0.05em; color: rgba(235,235,245,0.55);
  }

  /* Сгруппированный контейнер и ячейки */
  .group {
    background: rgba(255,255,255,0.055);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
  }
  .cell {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 11px 14px; min-height: 44px; position: relative;
  }
  .cell + .cell::before {
    content: ""; position: absolute; top: 0; left: 14px; right: 0; height: 1px;
    background: rgba(255,255,255,0.08);
  }
  .cell-label { font-size: 15px; letter-spacing: -0.01em; color: #f5f5f7; }
  .cell .v {
    font-size: 15px; color: rgba(235,235,245,0.6);
    font-variant-numeric: tabular-nums; letter-spacing: -0.01em;
  }

  /* Ползунки — во всю ширину ячейки */
  .cell.slider { flex-direction: column; align-items: stretch; gap: 9px; padding: 12px 14px 14px; }
  .cell.slider .slider-head { display: flex; align-items: baseline; justify-content: space-between; }
  .cell.slider .slider-head .label { font-size: 15px; letter-spacing: -0.01em; }

  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 4px; border-radius: 2px; outline: none;
    background: rgba(255,255,255,0.18);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 26px; height: 26px; border-radius: 50%; background: #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,0.35); cursor: pointer;
  }
  input[type=range]::-moz-range-thumb {
    width: 26px; height: 26px; border-radius: 50%; background: #fff; border: none;
    box-shadow: 0 1px 4px rgba(0,0,0,0.35); cursor: pointer;
  }
  input[type=range]::-moz-range-track { background: rgba(255,255,255,0.18); height: 4px; border-radius: 2px; }

  /* Выпадающий список — iOS pop-up button */
  .select-wrap { position: relative; }
  select {
    -webkit-appearance: none; appearance: none;
    background: rgba(118,118,128,0.24); color: #f5f5f7;
    border: none; border-radius: 8px;
    padding: 6px 30px 6px 12px; max-width: 190px;
    font-family: inherit; font-size: 15px; letter-spacing: -0.01em;
    text-align: right; cursor: pointer;
  }
  .select-wrap::after {
    content: ""; position: absolute; right: 12px; top: 50%; margin-top: -4px;
    width: 7px; height: 7px; pointer-events: none;
    border-right: 1.6px solid rgba(235,235,245,0.6);
    border-bottom: 1.6px solid rgba(235,235,245,0.6);
    transform: rotate(45deg);
  }

  /* Цвет фона — компактный образец */
  input[type=color] {
    -webkit-appearance: none; appearance: none;
    width: 52px; height: 30px; border: none; border-radius: 8px;
    background: none; padding: 0; cursor: pointer; overflow: hidden;
  }
  input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
  input[type=color]::-webkit-color-swatch { border: 1px solid rgba(255,255,255,0.25); border-radius: 8px; }
  input[type=color]::-moz-color-swatch { border: 1px solid rgba(255,255,255,0.25); border-radius: 8px; }

  /* iOS-переключатель */
  .switch { position: relative; display: inline-block; width: 51px; height: 31px; flex-shrink: 0; }
  .switch input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
  .switch .knob {
    position: absolute; inset: 0; border-radius: 31px;
    background: rgba(120,120,128,0.32); transition: background 0.25s ease;
  }
  .switch .knob::before {
    content: ""; position: absolute; top: 2px; left: 2px;
    width: 27px; height: 27px; border-radius: 50%; background: #fff;
    box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    transition: transform 0.25s cubic-bezier(.32,.72,0,1);
  }
  .switch input:checked + .knob { background: #30d158; }
  .switch input:checked + .knob::before { transform: translateX(20px); }

  /* Кнопки — iOS filled */
  .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 22px; }
  button {
    width: 100%; padding: 13px; border: none; border-radius: 14px;
    font-family: inherit; font-size: 16px; font-weight: 590; letter-spacing: -0.01em;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
    transition: background 0.2s, transform 0.06s;
  }
  #shuffleBtn, #pauseBtn { background: rgba(118,118,128,0.24); color: #f5f5f7; }
  #shuffleBtn:hover, #pauseBtn:hover { background: rgba(118,118,128,0.36); }
  button:active { transform: scale(0.98); }
  #closeBtn {
    margin-top: 12px; background: transparent; color: #ff453a; font-weight: 590;
  }
  #closeBtn:hover { background: rgba(255,69,58,0.12); }

  /* === Проводник — полноэкранный лист; золотая рамка = рамка ВСЕГО сайта === */
  #explorerPage {
    position: fixed; inset: 0; z-index: 22;
    background-color: #0a0a0a;
    display: none;
  }
  #explorerPage.open { display: block; }
  /* НИЗ: видео-фон на весь экран (рамка сверху маскирует до проёма) */
  #exVideo {
    position: absolute; inset: 0; z-index: 1;
    width: 100%; height: 100%; object-fit: cover;
  }
  /* СЕРЕДИНА: меню в проёме (инсеты задаёт JS) */
  .ex-inner {
    position: absolute; z-index: 2;
    top: 14%; right: 15%; bottom: 14%; left: 15%;
    display: flex; flex-direction: column; justify-content: center; overflow-y: auto;
    background: rgba(0,0,0,0.28);                    /* лёгкая подложка для читаемости */
    color: #f2e9d2;
    font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  /* ВЕРХ: рамка с прозрачным центром, поверх всего, клики проходят сквозь */
  #exFrame {
    position: absolute; inset: 0; z-index: 3; pointer-events: none;
    background-size: 100% 100%; background-repeat: no-repeat; background-position: center;
  }
  .ex-inner::-webkit-scrollbar { width: 0; }
  .ex-titlebar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 2px 2px 10px; font-size: 13px; letter-spacing: 0.2em;
  }
  .ex-title { color: #f4d78a; text-shadow: 0 0 10px rgba(244,215,138,0.4); font-weight: 700; }
  .ex-close {
    background: transparent; border: none; color: #d9a441;
    font-size: 15px; cursor: pointer; font-family: inherit;
  }
  .ex-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 4px 2px; }
  .ex-item {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 16px 8px; cursor: pointer;
    background: rgba(244,215,138,0.05); border: 1px solid rgba(244,215,138,0.22);
    border-radius: 4px; color: #f2e9d2; font-family: inherit;
    font-size: 12px; letter-spacing: 0.1em;
    transition: background .15s, border-color .15s, transform .1s;
  }
  .ex-item:hover { background: rgba(244,215,138,0.14); border-color: #f4d78a; }
  .ex-item:active { transform: scale(0.97); }
  .ex-ico { font-size: 26px; line-height: 1; text-shadow: 0 0 10px rgba(244,215,138,0.4); }
  .ex-name { opacity: 0.9; }
  .ex-status {
    margin-top: 12px; padding: 8px 2px 2px; font-size: 11px;
    color: #b89a5a; letter-spacing: 0.1em; min-height: 16px;
  }

  /* === CRT-переход (схлопывание в линию, ЭЛТ вкл/выкл) === */
  #crt {
    position: fixed; inset: 0; z-index: 30; pointer-events: none;
    background: #060606; opacity: 0; visibility: hidden;
  }
  #crt.on { opacity: 1; visibility: visible; }
  #crt .bar {
    position: absolute; left: 0; right: 0; top: 50%;
    transform: translateY(-50%);
    height: 100%; width: 100%;
    background: #eaf6ff;
    box-shadow: 0 0 40px 14px rgba(190,235,255,0.85);
  }
  #crt::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.28) 0 1px, transparent 1px 3px);
  }

</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="panel">
  <div class="head">
    <span class="mark">VIA</span>
    <span class="sub">Пульт управления</span>
    <div class="head-line"></div>
  </div>

  <div class="sec"><span class="title">Экран</span></div>
  <div class="group">
    <div class="cell">
      <span class="cell-label">Формат</span>
      <div class="select-wrap">
        <select id="screenFormat">
          <option value="full">Во весь экран</option>
          <option value="16:9">16:9</option>
          <option value="1:1">1:1</option>
          <option value="9:16">9:16</option>
          <option value="4:3">4:3</option>
        </select>
      </div>
    </div>
    <div class="cell">
      <span class="cell-label">Цвет фона</span>
      <input type="color" id="bgColor" value="#000000">
    </div>
  </div>

  <div class="sec"><span class="title">Движение</span></div>
  <div class="group">
    <div class="cell slider">
      <div class="slider-head"><span class="label">Скорость</span><span class="v" id="val-speed">5.5</span></div>
      <input type="range" id="speed" min="0.5" max="20" step="0.5" value="5.5">
    </div>
    <div class="cell slider">
      <div class="slider-head"><span class="label">FPS</span><span class="v" id="val-fps">60</span></div>
      <input type="range" id="fps" min="5" max="120" step="1" value="60">
    </div>
    <div class="cell slider">
      <div class="slider-head"><span class="label">Размер логотипа</span><span class="v" id="val-size">320</span></div>
      <input type="range" id="size" min="60" max="700" step="10" value="320">
    </div>
    <div class="cell slider">
      <div class="slider-head"><span class="label">Количество</span><span class="v" id="val-count">1</span></div>
      <input type="range" id="count" min="1" max="15" step="1" value="1">
    </div>
    <div class="cell">
      <span class="cell-label">Логотипы друг с другом</span>
      <div class="select-wrap">
        <select id="collisionMode">
          <option value="bounce">Отталкиваются</option>
          <option value="through">Проходят сквозь</option>
        </select>
      </div>
    </div>
    <div class="cell slider">
      <div class="slider-head"><span class="label">Качество (пиксели)</span><span class="v" id="val-quality">1</span></div>
      <input type="range" id="quality" min="1" max="12" step="1" value="1">
    </div>
  </div>

  <div class="sec"><span class="title">След</span></div>
  <div class="group">
    <div class="cell">
      <span class="cell-label">Шлейф</span>
      <label class="switch"><input type="checkbox" id="trailOn"><span class="knob"></span></label>
    </div>
    <div class="cell">
      <span class="cell-label">Тип шлейфа</span>
      <div class="select-wrap">
        <select id="trailStyle">
          <option value="echo">Эхо (копии)</option>
          <option value="blur">Смаз (блюр)</option>
        </select>
      </div>
    </div>
    <div class="cell slider">
      <div class="slider-head"><span class="label">Длина шлейфа</span><span class="v" id="val-trail">1</span></div>
      <input type="range" id="trail" min="0" max="1" step="0.05" value="1">
    </div>
  </div>

  <div class="sec"><span class="title">Цвет и свет</span></div>
  <div class="group">
    <div class="cell">
      <span class="cell-label">Менять цвет при ударе</span>
      <label class="switch"><input type="checkbox" id="colorOn"><span class="knob"></span></label>
    </div>
    <div class="cell">
      <span class="cell-label">Неоновое свечение</span>
      <label class="switch"><input type="checkbox" id="glowOn"><span class="knob"></span></label>
    </div>
    <div class="cell">
      <span class="cell-label">Вращение</span>
      <label class="switch"><input type="checkbox" id="rotateOn"><span class="knob"></span></label>
    </div>
  </div>

  <div class="actions">
    <button id="shuffleBtn">Перемешать направления</button>
    <button id="pauseBtn">Пауза</button>
  </div>
  <button id="closeBtn">Закрыть</button>
</div>

<!-- CRT-переход: схлопывание в линию -->
<div id="crt"><div class="bar"></div></div>

<!-- Проводник — полноэкранный лист; рамка = фон, видео в проёме -->
<div id="explorerPage">
  <video id="exVideo" src="brand_assets/video5357368379114041753.mp4" muted loop playsinline></video>
  <div class="ex-inner">
    <div class="ex-titlebar">
      <span class="ex-title">VIA</span>
      <button class="ex-close" id="exClose">✕</button>
    </div>
    <div class="ex-grid">
      <button class="ex-item" data-target="settings"><span class="ex-ico">⚙</span><span class="ex-name">НАСТРОЙКИ</span></button>
      <button class="ex-item" data-target="about"><span class="ex-ico">◈</span><span class="ex-name">ОБО МНЕ</span></button>
      <button class="ex-item" data-target="music"><span class="ex-ico">♪</span><span class="ex-name">МУЗЫКА</span></button>
      <button class="ex-item" data-target="gallery"><span class="ex-ico">▦</span><span class="ex-name">ГАЛЕРЕЯ</span></button>
    </div>
    <div class="ex-status" id="exStatus">— выбери раздел —</div>
  </div>
  <div id="exFrame"></div>
</div>

// Яркая насыщенная палитра — точные, чистые цвета
const VIVID_PALETTE = [
  "#000000", // чёрный
  "#FFFFFF", // белый
  "#FF0026", // красный
  "#FF6A00", // оранжевый
  "#FFD400", // жёлтый
  "#B4FF00", // лаймовый
  "#00FF66", // зелёный
  "#00E0A0", // бирюзовый
  "#00C8FF", // голубой
  "#0017FF", // синий
  "#7B00FF", // фиолетовый
  "#FF00C8"  // маджента
];

function pickPalette() {
  return VIVID_PALETTE[Math.floor(Math.random() * VIVID_PALETTE.length)];
}

// Выбор цвета, гарантированно отличного от текущего — чтобы при ударе
// цвет всегда заметно менялся, а не иногда «оставался тем же»
function pickPaletteExcept(current) {
  if (VIVID_PALETTE.length < 2) return VIVID_PALETTE[0];
  let c;
  do { c = VIVID_PALETTE[Math.floor(Math.random() * VIVID_PALETTE.length)]; }
  while (c === current);
  return c;
}

// Автоматически подбираем контрастный цвет знака (белый или чёрный) под фон
function contrastFor(hex) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  const lum = (0.299*r + 0.587*g + 0.114*b) / 255;
  return lum > 0.55 ? "#000000" : "#ffffff";
}
// Точные половинные размеры лого с учётом текущего угла поворота —
// если вращение выключено, это просто половина ширины/высоты (без лишнего запаса)
function halfExtents(angle) {
  const hw = logoW / 2, hh = logoH() / 2;
  if (!rotateOn) return { ex: hw, ey: hh };
  const c = Math.abs(Math.cos(angle)), s = Math.abs(Math.sin(angle));
  return { ex: hw * c + hh * s, ey: hw * s + hh * c };
}

// === ПАРАМЕТРЫ ===
let speedSetting = 5.5;
let fps = 60;
let logoW = 320;
let logoCount = 1;
let quality = 1;
let trailOn = false;
let trailLength = 1; // 0 = нет следа, 1 = максимум (для эхо — 9 копий)
let trailStyle = "echo"; // "echo" — ретро-копии, "blur" — мягкий смаз
let collisionsOn = true;
let colorOn = false;
let glowOn = false;
let rotateOn = false;
let bgColor = "#000000";
let screenFormat = "full";
let paused = false;

const MARGIN = 0;
const ENGAGE_RADIUS = 70;
const JOYSTICK_MAX = 90;
const KICK_STRENGTH = 16;
const RELAX_RATE = 0.06;

const ASPECT_MAP = { "16:9": 16/9, "1:1": 1, "9:16": 9/16, "4:3": 4/3 };

function resize() {
  if (screenFormat === "full") {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  } else {
    const maxW = window.innerWidth;
    const maxH = window.innerHeight;
    const aspect = ASPECT_MAP[screenFormat];
    let w = maxW, h = w / aspect;
    if (h > maxH) { h = maxH; w = h * aspect; }
    canvas.width = Math.floor(w);
    canvas.height = Math.floor(h);
  }
  canvas.style.width = canvas.width + "px";
  canvas.style.height = canvas.height + "px";

  const b = bounds();
  logos.forEach(l => {
    l.cx = Math.min(Math.max(l.cx, b.minX), b.maxX);
    l.cy = Math.min(Math.max(l.cy, b.minY), b.maxY);
  });
}
window.addEventListener('resize', resize);

let logos = [];

function randUnit() {
  let a = Math.random() * Math.PI * 2;
  return [Math.cos(a), Math.sin(a)];
}

// Границы теперь считаются по ТОЧНЫМ размерам конкретного лого (его текущим ex/ey),
// поэтому при выключенном вращении лого доходит прямо до края (с отступом MARGIN)
function boundsFor(ex, ey) {
  return {
    minX: MARGIN + ex, maxX: Math.max(MARGIN + ex, canvas.width - MARGIN - ex),
    minY: MARGIN + ey, maxY: Math.max(MARGIN + ey, canvas.height - MARGIN - ey)
  };
}
function bounds() {
  const e = halfExtents(0);
  return boundsFor(e.ex, e.ey);
}

function makeLogo() {
  const b = bounds();
  const [ux, uy] = randUnit();
  const bg = pickPalette();
  return {
    cx: b.minX + Math.random() * Math.max(1, b.maxX - b.minX),
    cy: b.minY + Math.random() * Math.max(1, b.maxY - b.minY),
    vx: ux * speedSetting,
    vy: uy * speedSetting,
    bgColor: bg,
    markColor: contrastFor(bg),
    angle: Math.random() * Math.PI * 2,
    spin: (Math.random() - 0.5) * 0.04
  };
}

function rebuildLogos() {
  logos = [];
  for (let i = 0; i < logoCount; i++) logos.push(makeLogo());
}

resize();
rebuildLogos();

function reflectComponent(pos, vel, min, max) {
  // Если логотип больше холста, диапазон вырождается (min >= max) —
  // тогда просто держим его по центру, иначе while зациклится навсегда.
  if (max <= min) return [(min + max) / 2, vel];
  let p = pos + vel;
  let v = vel;
  while (p < min || p > max) {
    if (p < min) { p = 2 * min - p; v = -v; }
    if (p > max) { p = 2 * max - p; v = -v; }
  }
  return [p, v];
}

// Локальные оси лого (единичные векторы его сторон). Если вращение выключено,
// прямоугольник рисуется без поворота — значит и оси считаем по нулевому углу.
function obbAxes(l) {
  const ang = rotateOn ? l.angle : 0;
  const c = Math.cos(ang), s = Math.sin(ang);
  return [ { x: c, y: s }, { x: -s, y: c } ];
}

// Столкновение лого друг с другом по ТОЧНЫМ повёрнутым прямоугольникам (SAT).
// Проверяем все 4 оси сторон обоих лого — контакт наступает только когда реальные
// прямоугольники соприкасаются, без «безопасной зоны» вокруг повёрнутого лого.
function resolveCollisions() {
  const hw = logoW / 2, hh = logoH() / 2;
  for (let i = 0; i < logos.length; i++) {
    for (let j = i + 1; j < logos.length; j++) {
      const a = logos[i], b = logos[j];
      const axA = obbAxes(a), axB = obbAxes(b);
      const dx = b.cx - a.cx, dy = b.cy - a.cy;
      const axes = [axA[0], axA[1], axB[0], axB[1]];

      let minOverlap = Infinity, nx = 0, ny = 0, separated = false;
      for (const L of axes) {
        // радиус проекции каждого прямоугольника на ось L
        const rA = hw * Math.abs(axA[0].x * L.x + axA[0].y * L.y) + hh * Math.abs(axA[1].x * L.x + axA[1].y * L.y);
        const rB = hw * Math.abs(axB[0].x * L.x + axB[0].y * L.y) + hh * Math.abs(axB[1].x * L.x + axB[1].y * L.y);
        const dist = Math.abs(dx * L.x + dy * L.y);
        const overlap = rA + rB - dist;
        if (overlap <= 0) { separated = true; break; } // нашли разделяющую ось → не касаются
        if (overlap < minOverlap) { minOverlap = overlap; nx = L.x; ny = L.y; }
      }
      if (separated) continue;

      // нормаль направляем от a к b
      if (dx * nx + dy * ny < 0) { nx = -nx; ny = -ny; }
      // раздвигаем по кратчайшей оси перекрытия
      a.cx -= nx * minOverlap / 2; a.cy -= ny * minOverlap / 2;
      b.cx += nx * minOverlap / 2; b.cy += ny * minOverlap / 2;
      // упругий обмен нормальными компонентами скоростей (равные массы)
      const van = a.vx * nx + a.vy * ny;
      const vbn = b.vx * nx + b.vy * ny;
      const diff = vbn - van;
      if (diff < 0) { // только если сближаются — иначе не «залипают»
        a.vx += diff * nx; a.vy += diff * ny;
        b.vx -= diff * nx; b.vy -= diff * ny;
      }
      if (colorOn) {
        const bgA = pickPaletteExcept(a.bgColor); a.bgColor = bgA; a.markColor = contrastFor(bgA);
        const bgB = pickPaletteExcept(b.bgColor); b.bgColor = bgB; b.markColor = contrastFor(bgB);
      }
    }
  }
}

const off = document.createElement('canvas');
const offCtx = off.getContext('2d');
const markBuffer = document.createElement('canvas');
const markBufferCtx = markBuffer.getContext('2d');
const trailBuf = document.createElement('canvas');
const trailBufCtx = trailBuf.getContext('2d');

// Перекрашивает силуэт метки в нужный цвет, изолированно от фона карточки
function getColoredMark(w, h, color) {
  markBuffer.width = w;
  markBuffer.height = h;
  markBufferCtx.clearRect(0, 0, w, h);
  markBufferCtx.drawImage(markImg, 0, 0, w, h);
  markBufferCtx.globalCompositeOperation = "source-atop";
  markBufferCtx.fillStyle = color;
  markBufferCtx.fillRect(0, 0, w, h);
  markBufferCtx.globalCompositeOperation = "source-over";
  return markBuffer;
}

// Рисует одно лого в заданной точке/угле с заданной прозрачностью —
// используется и для текущего кадра, и для эхо-копий шлейфа.
function drawLogoAt(l, cx, cy, angle, alpha) {
  const lH = logoH();
  const renderScale = 1 / quality;
  offCtx.save();
  offCtx.globalAlpha = alpha;
  offCtx.scale(renderScale, renderScale);
  offCtx.translate(cx, cy);
  if (rotateOn) offCtx.rotate(angle);

  if (glowOn) {
    offCtx.shadowColor = colorOn ? l.bgColor : "#fff";
    offCtx.shadowBlur = 25;
  } else {
    offCtx.shadowBlur = 0;
  }

  if (colorOn) {
    offCtx.fillStyle = l.bgColor;
    offCtx.fillRect(-logoW / 2, -lH / 2, logoW, lH);
    if (markImg.complete) {
      const mw = Math.max(1, Math.round(logoW));
      const mh = Math.max(1, Math.round(lH));
      const coloredMark = getColoredMark(mw, mh, l.markColor);
      offCtx.drawImage(coloredMark, -logoW / 2, -lH / 2, logoW, lH);
    }
  } else {
    offCtx.filter = "none";
    if (logoImg.complete) {
      offCtx.drawImage(logoImg, -logoW / 2, -lH / 2, logoW, lH);
    }
  }
  offCtx.restore();
}

let lastTime = 0;

function draw(now) {
  requestAnimationFrame(draw);
  if (paused) return;

  const interval = 1000 / fps;
  if (now - lastTime < interval) return;
  lastTime = now;

  const w = canvas.width, h = canvas.height;
  const renderScale = 1 / quality;
  const newOffW = Math.max(1, Math.floor(w * renderScale));
  const newOffH = Math.max(1, Math.floor(h * renderScale));
  if (off.width !== newOffW || off.height !== newOffH) {
    off.width = newOffW;
    off.height = newOffH;
  }

  if (trailOn && trailStyle === "blur") {
    // Мягкий блюр-шлейф: прошлый кадр каждый раз слегка размывается и гаснет,
    // поэтому хвост плавно расплывается, а не оставляет чёткие наложенные копии.
    if (trailBuf.width !== off.width || trailBuf.height !== off.height) {
      trailBuf.width = off.width; trailBuf.height = off.height;
    }
    trailBufCtx.clearRect(0, 0, off.width, off.height);
    trailBufCtx.drawImage(off, 0, 0);            // сохраняем прошлый кадр

    offCtx.globalAlpha = 1;
    offCtx.fillStyle = bgColor;
    offCtx.fillRect(0, 0, off.width, off.height); // чистый фон

    // чем длиннее шлейф — тем дольше живёт хвост и тем мягче размытие
    const persist = Math.min(0.97, 0.30 + trailLength * 0.67);
    const blurPx = 0.5 + trailLength * 2.5;
    offCtx.filter = `blur(${blurPx}px)`;
    offCtx.globalAlpha = persist;
    offCtx.drawImage(trailBuf, 0, 0);            // приглушённый размытый хвост поверх фона
    offCtx.filter = 'none';
    offCtx.globalAlpha = 1;
  } else {
    // Эхо-шлейф и обычный режим рисуют по чистому фону (копии берутся из истории)
    offCtx.fillStyle = bgColor;
    offCtx.fillRect(0, 0, off.width, off.height);
  }

  for (const l of logos) {
    const e = halfExtents(l.angle);
    const b = boundsFor(e.ex, e.ey);
    const beforeVX = l.vx, beforeVY = l.vy;
    let [nx, nvx] = reflectComponent(l.cx, l.vx, b.minX, b.maxX);
    let [ny, nvy] = reflectComponent(l.cy, l.vy, b.minY, b.maxY);
    l.cx = nx; l.cy = ny;
    const bounced = (nvx !== beforeVX || nvy !== beforeVY);
    if (colorOn && bounced) {
      const bg = pickPaletteExcept(l.bgColor);
      l.bgColor = bg; l.markColor = contrastFor(bg);
    }
    if (bounced) {
      // крошечный случайный микро-поворот при отскоке — естественно ломает
      // идеальную периодичность движения, чтобы оно никогда не "зациклилось" точно на угол
      const jitter = (Math.random() - 0.5) * 0.05; // ~ ±1.4°, почти незаметно глазом
      const cosJ = Math.cos(jitter), sinJ = Math.sin(jitter);
      const jvx = nvx * cosJ - nvy * sinJ;
      const jvy = nvx * sinJ + nvy * cosJ;
      nvx = jvx; nvy = jvy;
    }
    l.vx = nvx; l.vy = nvy;
  }

  if (collisionsOn) resolveCollisions();

  // Физика скорости/вращения + запись истории позиций для эхо-шлейфа
  const echoOn = trailOn && trailStyle === "echo";
  const maxHistory = echoOn ? Math.max(0, Math.round(trailLength * 9)) : 0; // максимум 9 копий
  const minGap = 8; // ~2 мм — минимальный зазор, копии идут почти вплотную к лого
  for (const l of logos) {
    const mag = Math.hypot(l.vx, l.vy);
    if (mag > 0.0001) {
      const newMag = mag + (speedSetting - mag) * RELAX_RATE;
      const k = newMag / mag;
      l.vx *= k; l.vy *= k;
    }
    if (rotateOn) l.angle += l.spin;

    if (echoOn) {
      if (!l.trail) l.trail = [];
      const last = l.trail[l.trail.length - 1];
      if (!last || Math.hypot(l.cx - last.cx, l.cy - last.cy) >= minGap) {
        l.trail.push({ cx: l.cx, cy: l.cy, angle: l.angle, bg: l.bgColor, mark: l.markColor });
      }
      while (l.trail.length > maxHistory) l.trail.shift();
    } else if (l.trail && l.trail.length) {
      l.trail.length = 0; // сброс истории, когда эхо выключено
    }
  }

  // Эхо-копии позади: от старых (бледных) к новым (ярче), текущее лого — поверх
  if (echoOn) {
    for (const l of logos) {
      if (!l.trail) continue;
      const n = l.trail.length;
      for (let k = 0; k < n; k++) {
        const t = l.trail[k];
        const a = 0.5 * (k + 1) / n; // старые почти прозрачные, ближняя ~0.5
        const ghost = { bgColor: t.bg, markColor: t.mark };
        drawLogoAt(ghost, t.cx, t.cy, t.angle, a);
      }
    }
  }

  for (const l of logos) {
    drawLogoAt(l, l.cx, l.cy, l.angle, 1);
  }

  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, w, h);
  ctx.drawImage(off, 0, 0, off.width, off.height, 0, 0, w, h);
}

logoImg.onload = () => { requestAnimationFrame(draw); };

// === Джойстик-толчок (невидимый, без прямого перетаскивания) ===
let activeLogo = null;
let grabStartX = 0, grabStartY = 0, grabStartT = 0;
let tapTimer = null;
const DBL_MS = 280;

function findNearestLogo(mx, my) {
  let best = null, bestDist = Infinity;
  for (const l of logos) {
    const d = Math.hypot(mx - l.cx, my - l.cy);
    if (d < bestDist) { bestDist = d; best = l; }
  }
  if (best && bestDist <= ENGAGE_RADIUS) return best;
  return null;
}

canvas.addEventListener('pointerdown', (e) => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const l = findNearestLogo(mx, my);
  if (!l) return;
  canvas.setPointerCapture(e.pointerId);
  activeLogo = l;
  grabStartX = mx; grabStartY = my; grabStartT = performance.now();
});

canvas.addEventListener('pointerup', (e) => {
  if (!activeLogo) return;
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const totalDist = Math.hypot(mx - grabStartX, my - grabStartY);
  const totalTime = performance.now() - grabStartT;

  if (totalDist < 10 && totalTime < 350) {
    handleTap();
  } else {
    if (tapTimer) { clearTimeout(tapTimer); tapTimer = null; }
    let pullX = mx - activeLogo.cx;
    let pullY = my - activeLogo.cy;
    let pullLen = Math.hypot(pullX, pullY);
    if (pullLen > JOYSTICK_MAX) {
      pullX = pullX / pullLen * JOYSTICK_MAX;
      pullY = pullY / pullLen * JOYSTICK_MAX;
      pullLen = JOYSTICK_MAX;
    }
    if (pullLen > 0.001) {
      const nx = pullX / pullLen, ny = pullY / pullLen;
      const strength = (pullLen / JOYSTICK_MAX) * KICK_STRENGTH;
      activeLogo.vx += nx * strength;
      activeLogo.vy += ny * strength;
    }
  }
  activeLogo = null;
});

// === Контролы панели ===
function bindRange(id, valId, onChange) {
  const el = document.getElementById(id);
  const valEl = document.getElementById(valId);
  el.addEventListener('input', () => {
    valEl.textContent = el.value;
    onChange(parseFloat(el.value));
  });
}

bindRange('speed', 'val-speed', v => {
  speedSetting = v;
  logos.forEach(l => {
    const mag = Math.hypot(l.vx, l.vy);
    if (mag > 0.0001) {
      const k = v / mag;
      l.vx *= k; l.vy *= k;
    } else {
      const [ux, uy] = randUnit();
      l.vx = ux * v; l.vy = uy * v;
    }
  });
});
bindRange('fps', 'val-fps', v => fps = v);
bindRange('size', 'val-size', v => logoW = v);
bindRange('count', 'val-count', v => { logoCount = v; rebuildLogos(); });
bindRange('quality', 'val-quality', v => quality = v);
bindRange('trail', 'val-trail', v => trailLength = v);

document.getElementById('trailOn').addEventListener('change', e => trailOn = e.target.checked);
document.getElementById('trailStyle').addEventListener('change', e => {
  trailStyle = e.target.value;
  logos.forEach(l => { if (l.trail) l.trail.length = 0; }); // сброс истории при смене типа
});
document.getElementById('colorOn').addEventListener('change', e => colorOn = e.target.checked);
document.getElementById('glowOn').addEventListener('change', e => glowOn = e.target.checked);
document.getElementById('rotateOn').addEventListener('change', e => rotateOn = e.target.checked);
document.getElementById('bgColor').addEventListener('input', e => bgColor = e.target.value);

document.getElementById('collisionMode').addEventListener('change', e => {
  collisionsOn = (e.target.value === 'bounce');
});

document.getElementById('screenFormat').addEventListener('change', e => {
  screenFormat = e.target.value;
  resize();
});

document.getElementById('shuffleBtn').addEventListener('click', () => {
  logos.forEach(l => {
    const mag = Math.hypot(l.vx, l.vy) || speedSetting;
    const [ux, uy] = randUnit();
    l.vx = ux * mag; l.vy = uy * mag;
  });
});

document.getElementById('pauseBtn').addEventListener('click', (e) => {
  paused = !paused;
  e.target.textContent = paused ? "▶ Продолжить" : "⏸ Пауза";
});

document.getElementById('closeBtn').addEventListener('click', () => panel.classList.remove('open'));

// Закрытие панели по нажатию вне её области. Слушаем в фазе перехвата и
// гасим событие, чтобы этот же тап по холсту не открыл панель заново.
document.addEventListener('pointerdown', (e) => {
  if (panel.classList.contains('open') && !panel.contains(e.target)) {
    panel.classList.remove('open');
    e.stopPropagation();
  }
}, true);

// === Проводник: одиночный тап → проводник, двойной тап → настройки ===
const explorerPage = document.getElementById('explorerPage');
const exStatus = document.getElementById('exStatus');

function handleTap() {
  if (tapTimer) {                       // второй тап пришёл вовремя → двойной
    clearTimeout(tapTimer); tapTimer = null;
    openSettings();
  } else {                              // ждём: вдруг будет второй тап
    tapTimer = setTimeout(() => {
      tapTimer = null;
      openExplorer();                   // второго не было → одиночный
    }, DBL_MS);
  }
}

// CRT-переход: экран схлопывается в яркую линию → чернота (меняем «лист») →
// разворачивается обратно (ЭЛТ включается). swap() вызывается в «черноте».
const reduceMotion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const crt = document.getElementById('crt');
const crtBar = crt.querySelector('.bar');
function crtTransition(swap) {
  if (reduceMotion()) { if (swap) swap(); return; }
  crtBar.style.transition = 'none';
  crtBar.style.height = '100%';
  crtBar.style.width = '100%';
  crtBar.style.opacity = '1';
  crt.classList.add('on');
  void crt.offsetWidth;
  crtBar.style.transition = 'height .16s ease-in';   // фаза 1 — в линию
  crtBar.style.height = '3px';
  setTimeout(() => {
    if (swap) swap();                                 // меняем «лист» под чернотой
    crtBar.style.transition = 'width .12s ease-in, opacity .12s ease-in';
    crtBar.style.width = '14px';                       // фаза 2 — линия в точку
    crtBar.style.opacity = '0.9';
    setTimeout(() => {
      crtBar.style.transition = 'none';               // фаза 3 — ЭЛТ включается
      crtBar.style.width = '100%';
      crtBar.style.height = '3px';
      crtBar.style.opacity = '1';
      void crt.offsetWidth;
      crtBar.style.transition = 'height .18s ease-out';
      crtBar.style.height = '100%';
      setTimeout(() => {
        crt.style.transition = 'opacity .12s ease-out, visibility 0s linear .12s';
        crt.classList.remove('on');
        setTimeout(() => { crt.style.transition = ''; }, 160);
      }, 120);
    }, 130);
  }, 160);
}

function openExplorer() {
  if (panel.classList.contains('open')) return;       // не поверх настроек
  crtTransition(() => {
    refreshFrame();
    explorerPage.classList.add('open');
    exVideo.play().catch(() => {});                   // видео-фон (без звука)
    startMusic();                                     // музыка (тап = разрешение на звук)
  });
}
function closeExplorer() {
  crtTransition(() => { explorerPage.classList.remove('open'); stopMusic(); });
}
function openSettings() {
  explorerPage.classList.remove('open');              // без анимации — сразу к настройкам
  stopMusic();
  panel.classList.add('open');
}

document.getElementById('exClose').addEventListener('click', closeExplorer);

document.querySelectorAll('.ex-item').forEach(item => {
  item.addEventListener('click', () => {
    const target = item.dataset.target;
    if (target === 'settings') {
      openSettings();
    } else {
      exStatus.textContent = '// ' + item.querySelector('.ex-name').textContent + ' — в разработке';
    }
  });
});

// === Рамка (3 формата) + видео-фон в чёрном проёме ===
// Проёмы замерены точно (в пикселях) и вписаны жёстко — рамка тянется на весь экран
// (background-size:100% 100%), поэтому % картинки = % экрана, видео и меню ложатся в проём.
const exInner = document.querySelector('.ex-inner');
const exVideo = document.getElementById('exVideo');
const exFrame = document.getElementById('exFrame');
// Слои: видео (низ) → меню (середина) → рамка с прозрачным центром (верх, маскирует).
// ins — проём (замерен точно), под него позиционируем меню; видео на весь экран.
const FRAMES = {
  land: { src: 'brand_assets/frame-land.png', ins: { top: 13.76, right: 6.37,  bottom: 12.79, left: 6.48  } },
  med:  { src: 'brand_assets/frame-med.png',  ins: { top: 12.76, right: 13.98, bottom: 12.22, left: 14.84 } },
  tall: { src: 'brand_assets/frame-tall.png', ins: { top: 6.33,  right: 12.73, bottom: 6.52,  left: 13.77 } },
};
function pickFrame() {
  const r = window.innerWidth / window.innerHeight;
  if (r >= 1.2) return FRAMES.land;
  if (r >= 0.7) return FRAMES.med;
  return FRAMES.tall;
}
function applyHole(ins) {
  exInner.style.top = ins.top + '%';       exInner.style.right = ins.right + '%';
  exInner.style.bottom = ins.bottom + '%'; exInner.style.left = ins.left + '%';
}
let currentFrame = '';
function refreshFrame() {
  const fr = pickFrame();
  if (fr.src === currentFrame) return;
  currentFrame = fr.src;
  exFrame.style.backgroundImage = "url('" + fr.src + "')";
  applyHole(fr.ins);
}
window.addEventListener('resize', refreshFrame);
refreshFrame();

// === Музыка: локальные треки, играют по очереди при входе в проводник ===
const TRACKS = [
  'Grim Freestyle - No ID.m4a',
  'AAP Rocky - Best Of Me.mp3',
  'AAP ROCKY- FUCK 12.mp3',
].map(n => 'brand_assets/' + encodeURIComponent(n));
const exAudio = new Audio();
exAudio.volume = 0.6;
let trackIdx = 0;
exAudio.addEventListener('ended', () => {
  trackIdx = (trackIdx + 1) % TRACKS.length;
  exAudio.src = TRACKS[trackIdx];
  exAudio.play().catch(() => {});
});
function startMusic() {
  if (!exAudio.src) exAudio.src = TRACKS[trackIdx];
  exAudio.play().catch(() => {});
}
function stopMusic() { exAudio.pause(); }
</script>
